version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      # Required, never defaulted. This file used to ship `postgres:postgres`,
      # and the account name reused as its own password is exactly what a
      # reachable database then authenticates with - the same shape R6 refuses
      # for the signing key. Match the prod and unified-dev profiles.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; generate one with openssl rand -hex 32}
      POSTGRES_DB: ${POSTGRES_DB:-ai_investment_lab}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-ai_investment_lab}
      # Required, never defaulted: this file used to hand every stack it
      # started the same signing key, and that key was also the product's
      # field default. Generate one with `openssl rand -hex 32`.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required; generate one with openssl rand -hex 32}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      AI_PROVIDER: mock
      DATA_PROVIDER: demo
      APP_ENV: development
      ENABLE_LIVE_PAYMENTS: "false"
      ENABLE_PUBLIC_SHARING: "false"
      ENABLE_EXTERNAL_NOTIFICATIONS: "false"
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
